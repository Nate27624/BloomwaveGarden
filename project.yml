name: BloomwaveGarden
options:
  bundleIdPrefix: com.nate27624
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 13.0.0
targets:
  BloomwaveGarden:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BloomwaveGarden
        excludes:
          - WebBundle/**
      - path: BloomwaveGarden/WebBundle
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nate27624.bloomwavegarden
        PRODUCT_NAME: BloomwaveGarden
        CODE_SIGN_ENTITLEMENTS: BloomwaveGarden/BloomwaveGarden.entitlements
        INFOPLIST_FILE: BloomwaveGarden/Info.plist
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 4QJKW5H6GB
        CURRENT_PROJECT_VERSION: 3
        MARKETING_VERSION: 0.0.1
        BLOOMWAVE_ENABLE_IN_APP_PURCHASES: YES
        BLOOMWAVE_ENABLE_REWARDED_ADS: NO
        BLOOMWAVE_LIFETIME_PASS_ONLY_BACKGROUNDS: YES
        ADMOB_APP_ID: ca-app-pub-5407528260600092~4304575035
        ADMOB_REWARDED_AD_UNIT_ID: ca-app-pub-5407528260600092/7073831309
    dependencies:
      - package: GoogleMobileAds
    scheme:
      testTargets: []
